<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아무도없개 POP 제작기</title>
<style>
@font-face{font-family:GmarketBoldPOP;src:url('font-01-251d33f2be9a.otf') format('opentype');font-weight:700}
@font-face{font-family:GmarketMediumPOP;src:url('font-02-39845e70b835.otf') format('opentype');font-weight:500}
@font-face{font-family:PartialSansPOP;src:url('font-03-c0ba974c1556.otf') format('opentype');font-weight:400}
*{box-sizing:border-box}
body{margin:0;background:#eef0f3;font-family:GmarketMediumPOP,Arial,sans-serif;color:#111;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow-x:auto;white-space:nowrap}
button{font-family:GmarketBoldPOP;cursor:pointer}
.topbar button{height:40px;padding:0 14px;border:1px solid #d8dde6;border-radius:12px;background:#fff;font-size:13px;flex:0 0 auto}
.topbar .download{background:#f6bf00;border-color:#f6bf00}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:18px 8px 40px;overflow:hidden}
.posterWrap{width:620px;height:877px;position:relative;flex:0 0 auto}
.poster{position:absolute;left:0;top:0;width:620px;height:877px;background:var(--point,#f6bf00);overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.22);transform-origin:top left}
.inner{position:absolute;left:37.5px;top:27.5px;width:545px;height:822px;background:#fff;border-radius:110px 110px 0 0}
.logo{position:absolute;left:50%;top:62px;width:174px;height:70px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;z-index:2}
.logo img{max-width:100%;max-height:100%;display:block}
.zone{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.editable{width:100%;outline:none;line-height:1.06;word-break:keep-all;white-space:pre-line;cursor:text}
.editable:focus,.editable:hover,.dateZone:hover,.saleNumber:focus{outline:2px dashed rgba(37,99,235,.75);outline-offset:3px}
.storeZone{left:50%;top:138px;width:300px;height:31px;transform:translateX(-50%);background:var(--point,#f6bf00);border-radius:999px}
.store{font-family:GmarketBoldPOP;font-size:27px;font-weight:700}
.dateZone{left:50%;top:194px;width:480px;height:38px;transform:translateX(-50%);font-family:GmarketBoldPOP;font-size:27px;font-weight:700;cursor:pointer}
.event1Zone{left:50px;top:230px;width:520px;height:62px}
.event2Zone{left:50px;top:300px;width:520px;height:62px}
.eventText{font-family:PartialSansPOP;font-size:70px;color:#00152f}
.event2Zone .eventText{color:#ed111b}
.subtitleZone{left:30px;top:374px;width:560px;height:38px}
.subtitle{font-family:GmarketMediumPOP;font-size:22px;color:#111;line-height:1.25}
.saleBlock{position:absolute;left:50%;top:400px;width:596px;height:225px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;justify-content:center;overflow:visible;cursor:pointer}
.saleGroup{display:flex;align-items:center;justify-content:center;gap:10px;width:max-content;max-width:none;overflow:visible}
.saleNumber{width:267px;height:210px;display:block;border:0;background:transparent;margin:0;padding:0;font-family:PartialSansPOP;font-size:120px;color:#ed111b;line-height:1;text-align:center;outline:none;overflow:visible;cursor:text;-moz-appearance:textfield}
.saleNumber::-webkit-outer-spin-button,.saleNumber::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
.saleSide{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;min-width:110px;overflow:visible}
.salePercent{font-family:PartialSansPOP;font-size:78px;color:#ed111b;line-height:.85;text-align:left}
.saleText{font-family:PartialSansPOP;font-size:50px;color:#ed111b;line-height:.9;text-align:left}
.character{position:absolute;left:50%;bottom:25px;width:484px;height:255px;transform:translateX(-50%);z-index:7;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.character img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.menu{position:absolute;z-index:100;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;display:none;min-width:230px}
.menuTitle{font-family:GmarketBoldPOP;font-size:12px;margin:0 0 8px}
.swatches{display:grid;grid-template-columns:repeat(7,30px);gap:7px}
.swatch{width:30px;height:30px;border-radius:8px;border:1px solid #ddd;cursor:pointer}
.charChoices{display:grid;grid-template-columns:repeat(4,52px);gap:8px}
.charChoice{width:52px;height:52px;border:1px solid #ddd;border-radius:9px;background:#fff;padding:4px;cursor:pointer}
.charChoice img{width:100%;height:100%;object-fit:contain}
.menuRow{display:grid;gap:8px}
.menuRow button,.menuRow input{height:38px;border:1px solid #ddd;border-radius:8px;padding:0 8px;font-family:GmarketMediumPOP;font-size:16px;background:#fff}
.menuRow button{font-family:GmarketBoldPOP;background:#f6bf00;border:0}
.dateMenu{min-width:340px;padding:14px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.08);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dateMenuHeader{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.dateMenuHeader .menuTitle{margin:0;font-size:14px;letter-spacing:-.2px}
.dateMenu .dateFields{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:10px 12px}
.dateMenu .dateFields label{font-family:GmarketMediumPOP;font-size:13px;color:#6e6e73}
.dateMenu .dateFields input{width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:#f2f2f7;color:#1d1d1f;font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.dateMenu button{height:36px;padding:0 15px;border:0;border-radius:999px;font-family:GmarketBoldPOP;font-size:13px;cursor:pointer;transition:transform .14s ease,filter .14s ease}
.dateMenu button:hover{filter:brightness(.96)}
.dateMenu button:active{transform:scale(.96)}
.dateMenuApply{flex:0 0 auto;background:#007aff!important;color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.24)}
.dateMenuRemove{width:100%;margin-top:12px;background:#fff0f0!important;color:#ff3b30}
@media(max-width:760px){.dateMenu{min-width:0;padding:14px!important;border-radius:20px!important}.dateMenuHeader{position:sticky;top:0;z-index:1;padding-bottom:2px;background:rgba(255,255,255,.96)}.dateMenuApply{height:38px!important}}
.help{position:fixed;left:16px;bottom:16px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px 12px;box-shadow:0 8px 22px rgba(0,0,0,.12);font-size:12px;line-height:1.6;color:#555;z-index:40}
@media(max-width:760px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .topbar{justify-content:flex-start;padding:8px;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topbar button{height:38px;font-size:12px;padding:0 12px;flex:0 0 auto}
  .stage{width:100%;box-sizing:border-box;padding:10px 6px 18px;overflow:hidden;align-items:flex-start}
  .posterWrap{max-width:calc(100vw - 12px);margin:0 auto;flex:0 0 auto}
  .poster{transform-origin:top left;will-change:transform}
  .help{display:none}
  .menu{position:fixed!important;left:10px!important;right:10px!important;top:auto!important;bottom:12px!important;width:auto;min-width:0;max-height:70vh;overflow:auto}
}

/* 할인 프로모션 옵션 */
.promo{display:none;width:100%;height:100%;align-items:center;justify-content:center;overflow:visible}
.promo.active{display:flex}
.priceGroup,.plusGroup{display:flex;align-items:center;justify-content:center;width:max-content;max-width:100%;overflow:visible;color:#ed111b;font-family:PartialSansPOP}
.priceNumber{width:310px;height:150px;border:0;background:transparent;padding:0;margin:0;font-family:PartialSansPOP;font-size:112px;color:#ed111b;line-height:1;text-align:right;outline:none}
.wonText{font-family:PartialSansPOP;font-size:56px;color:#ed111b;line-height:1;margin-left:8px;align-self:center}
.priceSaleText{font-family:PartialSansPOP;font-size:48px;color:#ed111b;line-height:1;margin-left:20px;align-self:center}
.plusNumber{width:150px;height:165px;border:0;background:transparent;padding:0;margin:0;font-family:PartialSansPOP;font-size:150px;color:#ed111b;line-height:1;text-align:center;outline:none}
.plusTail{font-family:PartialSansPOP;font-size:150px;color:#ed111b;line-height:1;margin-left:8px}
.priceNumber::-webkit-outer-spin-button,.priceNumber::-webkit-inner-spin-button,.plusNumber::-webkit-outer-spin-button,.plusNumber::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
.promoTypeBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.promoTypeBtns button{height:38px;border:1px solid #ddd;border-radius:8px;background:#fff;font-family:GmarketBoldPOP}
@media(max-width:760px){
  .priceNumber{font-size:112px}
  .wonText{font-size:56px}
  .priceSaleText{font-size:48px}
  .plusNumber,.plusTail{font-size:150px}
}

</style>

async function downloadInstagram(){
  const poster = document.getElementById("poster");
  if(poster) poster.classList.add("instagramExportMode");

  const baseCanvas = await renderPosterCanvas();

  if(poster) poster.classList.remove("instagramExportMode");

  const bg = poster ? getComputedStyle(poster).backgroundColor : "#f6bf00";

  const outCanvas = document.createElement("canvas");
  outCanvas.width = 1080;
  outCanvas.height = 1350;

  const ctx = outCanvas.getContext("2d");
  ctx.fillStyle = bg || "#f6bf00";
  ctx.fillRect(0, 0, 1080, 1350);

  const scale = 1350 / baseCanvas.height;
  const drawW = baseCanvas.width * scale;
  const drawH = 1350;
  const drawX = (1080 - drawW) / 2;

  ctx.drawImage(baseCanvas, drawX, 0, drawW, drawH);

  const a = document.createElement("a");
  a.download = "아무도없개_POP_인스타그램_1080x1350.jpg";
  a.href = outCanvas.toDataURL("image/jpeg", 1.0);
  a.click();
}

let suppressTextClickUntil=0;
function installTextBoxDrag(el){
  if(!el) return;
  el.style.touchAction="none";
  let activated=false,startY=0,baseY=0,pointerId=null,lastTapAt=0,inputType="mouse",moveBox=null;
  function activateForPointer(e){
    activated=true;
    pointerId=e.pointerId;
    startY=e.clientY;
    baseY=parseFloat(el.dataset.offsetY||0)||0;
    moveBox=(el.parentElement && el.parentElement.classList.contains("zone")) ? el.parentElement : el;
    if(moveBox!==el) el.style.removeProperty("transform");
    suppressTextClickUntil=Date.now()+600;
    moveBox.classList.add("textDragActive");
    el.dataset.dragInput=inputType;
    if(inputType==="mouse") moveBox.style.setProperty("cursor","ns-resize","important");
    if(inputType==="touch" && navigator.vibrate) navigator.vibrate(40);
    try{el.setPointerCapture(pointerId);}catch(err){}
  }
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("selectstart",e=>{if(activated)e.preventDefault();});
  el.style.setProperty("-webkit-touch-callout","none");
  el.addEventListener("pointerdown",e=>{
    inputType=e.pointerType || "mouse";
    if(inputType==="mouse" && e.button!==0) return;
    if(inputType!=="mouse" && inputType!=="touch" && inputType!=="pen") return;
    const now=Date.now();
    if(now-lastTapAt<=500){
      e.preventDefault();
      lastTapAt=0;
      activateForPointer(e);
      return;
    }
    pointerId=e.pointerId;
    startY=e.clientY;
    activated=false;
  });
  el.addEventListener("pointermove",e=>{
    if(pointerId===null || e.pointerId!==pointerId || !activated) return;
    e.preventDefault();
    const posterEl=document.getElementById("poster"),posterScale=posterEl?Math.max(.1,posterEl.getBoundingClientRect().width/620):1;
    const dy=(e.clientY-startY)/posterScale;
    const y=Math.max(-300,Math.min(300,baseY+dy));
    el.dataset.offsetY=y.toFixed(1);
    if(moveBox) moveBox.style.setProperty("transform",`translateY(${y}px)`,"important");
  });
  const endPointer=e=>{
    if(pointerId===null || e.pointerId!==pointerId) return;
    if(activated){
      suppressTextClickUntil=Date.now()+300;
      if(moveBox){
        moveBox.classList.remove("textDragActive");
        moveBox.style.removeProperty("cursor");
      }
      delete el.dataset.dragInput;
      try{el.releasePointerCapture(pointerId);}catch(err){}
    }else{
      lastTapAt=Date.now();
    }
    pointerId=null;
    activated=false;
    moveBox=null;
  };
  el.addEventListener("pointerup",endPointer);
  el.addEventListener("pointercancel",e=>{
    lastTapAt=0;
    endPointer(e);
  });
}

function setPromoMode(mode){
  const posterForNotice = document.getElementById("poster");
  if(posterForNotice){
    posterForNotice.classList.toggle("noticeMode", mode === "notice");
    posterForNotice.classList.toggle("receiptMode", mode === "receipt");
  }
  promoMode = mode;
  document.querySelectorAll(".promo").forEach(el=>el.classList.remove("active"));

  if(mode === "receipt"){
    posterForNotice.classList.remove("noticeMode");
    posterForNotice.classList.add("receiptMode");
    setBg("#f6bf00");
    setCharacter(0);
    applyCharacterSize(parseInt(document.getElementById("characterImg").dataset.characterSize||100,10));
    if(typeof fitReceiptFields === "function") fitReceiptFields();
    hideMenu();
    return;
  }else if(mode === "notice"){
    const event1El = document.getElementById("event1");
    const event2El = document.getElementById("event2");
    const subtitleEl = document.getElementById("subtitle");
    if(event1El) event1El.innerText = "안내사항";
    if(event2El) event2El.innerText = "안내문구";
    if(subtitleEl) subtitleEl.innerText = "안내사항 설명";
    if(typeof fitAll === "function") fitAll();
    hideMenu();
    return;
  }else if(mode === "price"){
    document.getElementById("promoPrice").classList.add("active");
    normalizePrice();
  }else if(mode === "plus"){
    document.getElementById("promoPlus").classList.add("active");
    fitPlus();
  }else{
    promoMode = "percent";
    document.getElementById("promoPercent").classList.add("active");
    normalizeSale();
  }
  hideMenu();
}

function normalizePrice(){
  const el = document.getElementById("priceNumber");
  let raw = String(el.value || "").replace(/[^0-9]/g,"").slice(0,5);
  if(raw === "") raw = "10000";
  let n = Math.max(0, Math.min(99999, parseInt(raw,10) || 0));
  el.value = n.toLocaleString("ko-KR");
  fitPrice();
}

function fitPrice(){
  const el = document.getElementById("priceNumber");
  const group = document.querySelector(".priceGroup");
  const won = document.querySelector(".wonText");
  const rawDigits = String(el.value || "").replace(/[^0-9]/g,"");
  const n = parseInt(rawDigits || "0", 10);
  const display = String(el.value || "");

  if(n >= 10000){            // 10,000 ~ 99,999
    el.style.setProperty("--priceSize", "72px");
    el.style.setProperty("--priceW", "440px");
    if(group) group.style.setProperty("--priceGroupX", "-24px");
    if(won){
      won.style.setProperty("--wonX", "18px");
      won.style.setProperty("--wonGap", "8px");
    }
  }else if(display.length >= 5){ // 1,000 ~ 9,999
    el.style.setProperty("--priceSize", "86px");
    el.style.setProperty("--priceW", "380px");
    if(group) group.style.setProperty("--priceGroupX", "-10px");
    if(won){
      won.style.setProperty("--wonX", "0px");
      won.style.setProperty("--wonGap", "4px");
    }
  }else{
    el.style.setProperty("--priceSize", "98px");
    el.style.setProperty("--priceW", "320px");
    if(group) group.style.setProperty("--priceGroupX", "0px");
    if(won){
      won.style.setProperty("--wonX", "0px");
      won.style.setProperty("--wonGap", "4px");
    }
  }
  resizePromoNumberBox(el,parseFloat(window.getComputedStyle(el).fontSize)||98);
}

function fitPlus(){
  const el = document.getElementById("plusNumber");
  let raw = String(el.value || "").replace(/[^0-9]/g,"").slice(-1);
  if(raw === "" || raw === "0") raw = "1";
  el.value = raw;
  const tail = document.querySelector(".plusTail");
  if(tail) tail.textContent = "+ 1";
  resizePromoNumberBox(el,parseFloat(window.getComputedStyle(el).fontSize)||150);
}

function normalizePromo(){
  if(promoMode === "price") normalizePrice();
  else if(promoMode.startsWith("plus")) fitPlus();
  else normalizeSale();
}

    this.value = n.toLocaleString("ko-KR");
    fitPrice();
    setTimeout(()=>this.setSelectionRange(this.value.length, this.value.length),0);
  });
  priceInput.addEventListener("blur", normalizePrice);
  priceInput.addEventListener("focus", function(){ setTimeout(()=>this.select(),0); });
}

function copyCurrentPosterValuesToClone(clone){
  const poster = document.getElementById("poster");

  const copyText = (id)=>{
    const src = document.getElementById(id);
    const dst = clone.querySelector("#" + id);
    if(src && dst){
      if("value" in src) dst.setAttribute("data-export-value", src.value);
      else dst.innerText = src.innerText || "";
    }
  };

  ["store","dateText","event1","event2","subtitle","saleNumber","priceNumber","plusNumber"].forEach(copyText);

  const srcChar = document.getElementById("characterImg");
  const dstChar = clone.querySelector("#characterImg");
  if(srcChar && dstChar) dstChar.src = srcChar.src;
  [".storeZone",".dateZone"].forEach(selector=>{const src=poster.querySelector(selector),dst=clone.querySelector(selector);if(src&&dst){const cs=getComputedStyle(src);dst.style.setProperty("width",cs.width,"important");dst.style.setProperty("height",cs.height,"important");dst.style.setProperty("min-height",cs.minHeight,"important");}});

  // html2canvas에서 input 글자가 잘리는 문제 방지:
  // 캡처용 clone 안에서는 입력칸을 div로 바꿔 실제 텍스트처럼 렌더링
  ["saleNumber","priceNumber","plusNumber"].forEach(id=>{
    const el = clone.querySelector("#" + id);
    const src = document.getElementById(id);
    if(el && src && "value" in src){
      const div = document.createElement("div");
      div.id = id;
      div.className = el.className + " exportTextField";
      div.innerText = src.value || "";
      div.style.cssText = el.style.cssText || "";
      const computed=window.getComputedStyle(src);
      ["width","height","minWidth","minHeight","fontFamily","fontSize","fontWeight","lineHeight","letterSpacing","color","textAlign","padding","margin","transform"].forEach(prop=>div.style.setProperty(prop.replace(/[A-Z]/g,m=>"-"+m.toLowerCase()),computed[prop],"important"));
      div.style.setProperty("display","flex","important");div.style.setProperty("align-items","center","important");div.style.setProperty("justify-content",src.id==="priceNumber"?"flex-end":"center","important");div.style.setProperty("overflow","visible","important");
      el.replaceWith(div);
    }
  });

  const tail = clone.querySelector(".plusTail");
  if(tail) tail.textContent = "+ 1";
}

<style id="v26-4-no-linebreak-input-output">
/* v26.4: 이벤트명1/이벤트명2/부제목은 줄바꿈 자체 차단 + 화면도 한 줄 고정 */
#poster #event1,
#poster #event2,
#poster #subtitle{
  white-space: nowrap !important;
  word-break: keep-all !important;
  overflow-wrap: normal !important;
  word-wrap: normal !important;
  text-wrap: nowrap !important;
  overflow: hidden !important;
}
</style>

<script id="v26-4-no-linebreak-input-output">
(function(){
  var IDS = ["event1", "event2", "subtitle"];
  var runningFit = false;

  function isTarget(el){
    return !!(el && IDS.indexOf(el.id) !== -1);
  }

  function normalizeText(text){
    return String(text == null ? "" : text).replace(/[\r\n\u2028\u2029]+/g, " ");
  }

  function textOf(el){
    return el ? (el.textContent || "") : "";
  }

  function caretOffset(el){
    try{
      var sel = window.getSelection();
      if(!sel || sel.rangeCount === 0) return null;
      var range = sel.getRangeAt(0);
      if(!el.contains(range.startContainer)) return null;
      var pre = range.cloneRange();
      pre.selectNodeContents(el);
      pre.setEnd(range.startContainer, range.startOffset);
      return pre.toString().length;
    }catch(err){
      return null;
    }
  }

  function setCaret(el, offset){
    try{
      if(offset == null) return;
      var textLength = textOf(el).length;
      var target = Math.max(0, Math.min(offset, textLength));
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      var node, count = 0;
      while((node = walker.nextNode())){
        var next = count + node.nodeValue.length;
        if(target <= next){
          var range = document.createRange();
          range.setStart(node, target - count);
          range.collapse(true);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          return;
        }
        count = next;
      }
      var range2 = document.createRange();
      range2.selectNodeContents(el);
      range2.collapse(false);
      var sel2 = window.getSelection();
      sel2.removeAllRanges();
      sel2.addRange(range2);
    }catch(err){}
  }

  function applyOneLineStyle(el){
    if(!isTarget(el)) return;
    el.setAttribute("contenteditable", "plaintext-only");
    el.style.whiteSpace = "nowrap";
    el.style.wordBreak = "keep-all";
    el.style.overflowWrap = "normal";
    el.style.wordWrap = "normal";
    el.style.overflow = "hidden";
  }

  function cleanNoBreak(el){
    if(!isTarget(el)) return false;
    var before = textOf(el);
    var after = normalizeText(before);
    if(before !== after){
      var pos = caretOffset(el);
      var removedBeforeCaret = 0;
      if(pos != null){
        removedBeforeCaret = (before.slice(0, pos).match(/[\r\n\u2028\u2029]/g) || []).length;
      }
      el.textContent = after;
      setCaret(el, pos == null ? null : pos - removedBeforeCaret);
      return true;
    }
    return false;
  }

  function fitOneLine(el){
    if(!isTarget(el) || !el.parentElement) return;
    applyOneLineStyle(el);
    var parent = el.parentElement;
    var isSub = el.id === "subtitle";
    var min = isSub ? 12 : 30;
    var current = parseFloat(window.getComputedStyle(el).fontSize) || (isSub ? 22 : 70);
    while(current > min && el.scrollWidth > parent.clientWidth){
      current -= 1;
      el.style.fontSize = current + "px";
    }
    applyOneLineStyle(el);
  }

  function fitTargets(){
    IDS.forEach(function(id){
      var el = document.getElementById(id);
      if(el) fitOneLine(el);
    });
  }

  function initTargets(){
    IDS.forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      applyOneLineStyle(el);
      cleanNoBreak(el);
    });
    fitTargets();
  }

  document.addEventListener("keydown", function(e){
    if(!isTarget(e.target)) return;
    if(e.key === "Enter"){
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
  }, true);

  document.addEventListener("beforeinput", function(e){
    if(!isTarget(e.target)) return;
    if(e.inputType === "insertParagraph" || e.inputType === "insertLineBreak"){
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
    if(e.data && /[\r\n\u2028\u2029]/.test(e.data)){
      e.preventDefault();
      e.stopImmediatePropagation();
      document.execCommand("insertText", false, normalizeText(e.data));
      return false;
    }
  }, true);

  document.addEventListener("paste", function(e){
    if(!isTarget(e.target)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var text = "";
    if(e.clipboardData) text = e.clipboardData.getData("text/plain") || e.clipboardData.getData("text") || "";
    else if(window.clipboardData) text = window.clipboardData.getData("Text") || "";
    document.execCommand("insertText", false, normalizeText(text));
    requestAnimationFrame(function(){ cleanNoBreak(e.target); fitOneLine(e.target); });
    return false;
  }, true);

  document.addEventListener("input", function(e){
    if(!isTarget(e.target)) return;
    applyOneLineStyle(e.target);
    cleanNoBreak(e.target);
    requestAnimationFrame(function(){ fitOneLine(e.target); });
  }, true);

  document.addEventListener("blur", function(e){
    if(!isTarget(e.target)) return;
    applyOneLineStyle(e.target);
    cleanNoBreak(e.target);
    fitOneLine(e.target);
  }, true);

  var originalFitAll = window.fitAll;
  window.fitAll = function(){
    if(runningFit) return;
    runningFit = true;
    try{
      if(typeof originalFitAll === "function") originalFitAll.apply(this, arguments);
      initTargets();
    }finally{
      runningFit = false;
    }
  };

  window.addEventListener("load", initTargets);
  setTimeout(initTargets, 0);
})();
</script>
